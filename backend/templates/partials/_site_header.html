<header class="dc-site-header">
    <div class="container dc-header-layout">
        <a class="dc-brand" href="{% url 'dashboard:home' %}" aria-label="Dev Coordination Hub home">
            <span class="dc-brand-mark" aria-hidden="true">D<span class="dc-brand-mark-accent">/</span>H</span>
            <span class="dc-brand-name">
                <strong>Dev Coordination Hub</strong>
                <small>Development workspace</small>
            </span>
        </a>

        <!-- Desktop navigation remains visible regardless of mobile disclosure state. -->
        <nav class="dc-desktop-nav" aria-label="Primary navigation">
            {% include 'partials/_nav_links.html' %}
        </nav>

        <!-- Native mobile menu is keyboard-operable without any JavaScript. -->
        <details class="dc-mobile-menu">
            <summary class="dc-menu-toggle">
                <span>Menu</span>
                <span class="dc-menu-icon" aria-hidden="true"><span></span><span></span></span>
            </summary>
            <nav class="dc-mobile-nav" aria-label="Mobile navigation">
                {% include 'partials/_nav_links.html' %}
            </nav>
        </details>
    </div>
</header>
